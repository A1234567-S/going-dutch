<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the trip · Going Dutch</title><link rel="icon" href="icon.png">
<meta name="robots" content="noindex">
<meta property="og:title" content="Join our trip on Going Dutch">
<meta property="og:description" content="Split costs together, in any currency.">
<meta property="og:image" content="https://a1234567-s.github.io/going-dutch/icon.png">
<style>
:root{--ground:#FBF3E6;--ink:#2A1D16;--muted:#7A6556;--accent:#E2622A;--line:#EADCC7}
@media (prefers-color-scheme:dark){:root{--ground:#1C1512;--ink:#F5EBDD;--muted:#B9A796;--accent:#F08A5D;--line:#3A2C24}}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:420px;margin:0 auto;padding:72px 20px 48px;text-align:center}
img{width:88px;height:88px;border-radius:20px}
h1{font:400 34px/1.15 "New York",Georgia,serif;margin:20px 0 8px}
p{margin:0 0 28px;color:var(--muted)}
a.btn{display:block;padding:15px 20px;border-radius:999px;font-weight:600;text-decoration:none;margin:0 0 12px}
.primary{background:var(--accent);color:#fff}
.secondary{border:1.5px solid var(--ink);color:var(--ink)}
.small{font-size:14px;margin-top:28px}
</style></head><body><main>
<img src="icon.png" alt="Going Dutch">
<h1>Join the trip</h1>
<p>Open it in Going Dutch, then tap your name.</p>
<a class="btn primary" id="open" href="#">Open in Going Dutch</a>
<a class="btn secondary" href="https://apps.apple.com/app/id6815189694">Get Going Dutch on the App Store</a>
<p class="small">Don’t have the app yet? Install it, then tap your invite link again.</p>
</main>
<script>
// The trip id stays in the #fragment, so it never reaches any server.
var id = (location.hash || "").slice(1);
var ok = /^[0-9a-f-]{36}$/i.test(id);
var link = ok ? "goingdutch://join/" + id : null;
var open = document.getElementById("open");
if (link) { open.href = link; setTimeout(function () { location.href = link; }, 150); }
else { open.style.display = "none"; }
</script>
</body></html>
